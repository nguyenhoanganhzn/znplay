services:
  - type: web
    name: znplay-test
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HOANNGUYEN_EMAIL
        sync: false
      - key: HOANNGUYEN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
